name: PC Monitor CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-dotnet:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: |
        dotnet restore Backend/Backend.csproj
        dotnet restore Agent/Agent.csproj

    - name: Build Backend
      run: dotnet build Backend/Backend.csproj --configuration Release --no-restore

    - name: Build Agent
      run: dotnet build Agent/Agent.csproj --configuration Release --no-restore

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install & Build
      run: |
        cd frontend
        npm install
        npm run build
